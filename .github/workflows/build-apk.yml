name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm install
        run: npm ci --legacy-peer-deps

      # sdkmanager (cmdline-tools 16+) requires JDK 17+,
      # so install the Android SDK with the runner's default JDK first...
      - name: install sdk components
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK/cmdline-tools"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-30" "build-tools;30.0.2" "ndk;20.1.5948944"

      # ...then switch to JDK 11, which Gradle 6.9 requires.
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: generate release keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.keystore \
            -alias my-key-alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bismillah -keypass bismillah \
            -dname "CN=BAQI, OU=GMJ, O=BAQI, L=Jakarta, ST=DKI Jakarta, C=ID"

      - name: build apk (release)
        working-directory: android
        env:
          # RN 0.65 / Metro lama masih pakai hash MD4 yang dihapus OpenSSL 3
          NODE_OPTIONS: --openssl-legacy-provider
        run: ./gradlew assembleRelease

      - name: release to github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" "$APK" \
              --title "BAQI ${{ github.ref_name }}" \
              --notes "Rilis dari tag ${{ github.ref_name }}." \
              --repo "${{ github.repository }}"
          else
            gh release delete dev --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh release create dev "$APK" \
              --title "BAQI (build otomatis)" \
              --notes "Build otomatis dari main. commit: ${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi